<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>釣果ギャラリー | daichi Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css"> <style>
        /* 魚ギャラリー用のホバーエフェクト */
        .fish-img {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            aspect-ratio: 1 / 1; /* 正方形にトリミングして統一感を出す */
            object-fit: cover;
        }
        .fish-img:hover {
            transform: scale(1.05);
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15) !important;
            z-index: 10;
        }
        
        /* モーダル表示時の閉じるボタンの配置調整 */
        .modal-close-btn {
            z-index: 1055;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container min-vh-100 py-5">
        <div class="card shadow-lg border-0 rounded-4 w-100 mx-auto" style="max-width: 1000px;">
            <div class="card-body p-4 p-md-5">
                
                <div class="text-center mb-5">
                    <h1 class="display-6 fw-bold text-dark mb-3">
                        <i class="fa-solid fa-fish-fins text-primary me-2"></i>Fishing Gallery
                    </h1>
                    <p class="text-secondary">
                        Thank you for opening it!!<br>
                        このページでは釣れた魚の写真をUPしています、是非見ていって下さい!!
                    </p>
                </div>

                <hr class="mb-4 text-muted">

                <div class="row row-cols-3 row-cols-md-4 row-cols-lg-5 g-3 justify-content-center" id="fishGallery">
                    </div>

                <div class="text-center mt-5">
                    <a href="profile.html" class="btn btn-outline-secondary rounded-pill px-4 py-2 me-2 shadow-sm transition-all">
                        <i class="fa-solid fa-user me-2"></i>Profile
                    </a>
                    <a href="index.html" class="btn btn-dark rounded-pill px-4 py-2 shadow-sm transition-all">
                        <i class="fa-solid fa-house me-2"></i>Home
                    </a>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body p-0 text-center position-relative">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3 modal-close-btn" data-bs-dismiss="modal" aria-label="Close"></button>
                    <img src="" id="modalSrcImage" class="img-fluid rounded-3 shadow-lg" alt="拡大写真" style="max-height: 85vh; object-fit: contain;">
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center pb-4 text-muted">
        <p class="mb-0 small">© 2026 daichi Portfolio</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const fishCount = 20;
        const gallery = document.getElementById("fishGallery");

        // JSで画像を生成（クリックイベントとして zoomImage 関数を呼び出すように設定）
        for (let i = 1; i <= fishCount; i++) {
            gallery.innerHTML += `
                <div class="col">
                    <img src="image/fish${i}.jpg"
                        class="img-fluid rounded-3 shadow-sm fish-img w-100"
                        alt="釣果写真 ${i}" 
                        loading="lazy"
                        onclick="zoomImage('image/fish${i}.jpg')">
                </div>
            `;
        }

        // BootstrapのモーダルをJavaScriptから操作するための準備
        const imgModal = new bootstrap.Modal(document.getElementById('imageModal'));
        const modalSrcImage = document.getElementById('modalSrcImage');

        // 画像をクリックしたときに実行される関数
        function zoomImage(imagePath) {
            modalSrcImage.src = imagePath; // モーダル内の画像パスを切り替え
            imgModal.show();               // モーダルをふわっと表示
        }
    </script>
</body>
</html>
