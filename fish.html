<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="照喜名太智のルアーフィッシング釣果ギャラリー">
    <title>釣果ギャラリー | Daichi Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">本文へ移動</a>

    <main id="main-content">
        <section class="site-shell gallery-page">
            <div class="hardware-panel gallery-panel">
                <div class="gallery-intro">
                    <h1><i class="fa-solid fa-fish-fins" aria-hidden="true"></i>Fishing Gallery</h1>
                    <p>Thank you for opening it!!<br>このページでは釣れた魚の写真を公開しています。ぜひ見ていってください。</p>
                </div>

                <div class="gallery-grid" id="fishGallery" aria-label="釣果写真一覧"></div>

                <div class="gallery-actions">
                    <a href="index.html#about" class="action-button action-button-primary"><i class="fa-solid fa-user" aria-hidden="true"></i>Profile</a>
                    <a href="index.html" class="action-button action-button-secondary"><i class="fa-solid fa-house" aria-hidden="true"></i>Home</a>
                </div>
            </div>
        </section>
    </main>

    <dialog class="image-dialog" id="imageDialog" aria-label="釣果写真の拡大表示">
        <form method="dialog"><button class="dialog-close" type="submit" aria-label="拡大表示を閉じる"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></form>
        <img class="dialog-image" src="" id="dialogImage" alt="">
    </dialog>

    <footer class="footer-bar"><p>© 2026 Daichi Terukina Portfolio</p></footer>
    <script src="js/fish-gallery.js"></script>
</body>
</html>
