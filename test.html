<!DOCTYPE html>
<html>
<head>
    <title>Bounded Circle Collision</title>
    <style>
        /* 全体の背景を明るいグレーに */
        body { 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #fdfdfd; 
            font-family: 'Segoe UI', sans-serif;
        }
        /* キャンバスに枠線をつけて「範囲」を可視化 */
        canvas { 
            background: #ffffff; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 8px;
            border: 2px solid #ddd;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="myCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');

        class Ball {
            constructor(x, y, r, text, url, color) {
                this.x = x;
                this.y = y;
                this.r = r;
                this.text = text;
                this.url = url;
                this.color = color;
                // 速度をさらにゆっくりに設定
                this.dx = (Math.random() - 0.5) * 2.5;
                this.dy = (Math.random() - 0.5) * 2.5;
            }

            draw() {
                // 円の影（少し浮かび上がる演出）
                ctx.shadowColor = 'rgba(0, 0, 0, 0.1)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 5;

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // 影をリセットしてテキストを描画
                ctx.shadowColor = 'transparent';
                ctx.fillStyle = "white";
                ctx.font = "bold 15px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.text, this.x, this.y);
            }

            update() {
                // 【重要】壁の判定をキャンバスのサイズ（指定範囲）に合わせる
                if (this.x + this.r > canvas.width || this.x - this.r < 0) {
                    this.dx *= -1;
                    // 枠外にはみ出さないように補正
                    this.x = (this.x - this.r < 0) ? this.r : canvas.width - this.r;
                }
                if (this.y + this.r > canvas.height || this.y - this.r < 0) {
                    this.dy *= -1;
                    // 枠外にはみ出さないように補正
                    this.y = (this.y - this.r < 0) ? this.r : canvas.height - this.r;
                }

                this.x += this.dx;
                this.y += this.dy;
                this.draw();
            }
        }

        const balls = [
            new Ball(150, 200, 50, "Google", "https://google.com", "#4285F4"),
            new Ball(450, 200, 50, "YouTube", "https://youtube.com", "#EA4335")
        ];

        // ボール同士の衝突解決
        function resolveCollision(b1, b2) {
            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const distance = Math.sqrt(dx*dx + dy*dy);
            
            if (distance < b1.r + b2.r) {
                // 速度の入れ替え
                [b1.dx, b2.dx] = [b2.dx, b1.dx];
                [b1.dy, b2.dy] = [b2.dy, b1.dy];

                // 重なり解消
                const overlap = (b1.r + b2.r - distance) / 2;
                const nx = dx / distance;
                const ny = dy / distance;
                b1.x -= nx * overlap;
                b1.y -= ny * overlap;
                b2.x += nx * overlap;
                b2.y += ny * overlap;
            }
        }

        function animate() {
            // 背景をクリア（Light設定なので白で塗りつぶし）
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            resolveCollision(balls[0], balls[1]);
            balls.forEach(ball => ball.update());

            requestAnimationFrame(animate);
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            balls.forEach(ball => {
                const dist = Math.sqrt((mouseX - ball.x)**2 + (mouseY - ball.y)**2);
                if (dist < ball.r) {
                    ball.color = `hsl(${Math.random() * 360}, 60%, 50%)`;
                    setTimeout(() => window.open(ball.url, '_blank'), 200);
                }
            });
        });

        animate();
    </script>
</body>
</html>
